Brief Description of Goal of Code:

<head> 
  <title>App6---HTML5-Canvas</title>  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="w3.css">
  <link rel="stylesheet" href="w3-colors-flat.css">
  <style>
    .body {
      margin: 0em;
    }
    .page {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: -100vw;
      overflow-y: auto;
      z-index: 0;
      background-color: hsl(0,0%,100%);
    }
    .page:target {
      left: 0vw;
      z-index: 1;
    }
    canvas {
      border: 3px solid #2c3e50; /* Nice dark blue border */
    }
  </style>
  <script>
    // Show when the file was last modified for development tracking
    var docMod = document.lastModified;
    alert("This file last modified " + docMod);
    console.log("This file last modified " + docMod);

    let canvas, ctx;

    function setupCanvas() {
      canvas = document.getElementById("myCanvas");
      ctx = canvas.getContext("2d");
    }

    // Draws a filled rectangle on the canvas
    function drawRectangle() {
      ctx.fillStyle = "#3498db"; // Peter River blue
      ctx.fillRect(50, 50, 200, 100); // x, y, width, height
    }

    // Draws your name on the canvas
    function drawName() {
      ctx.fillStyle = "#2ecc71"; // Emerald green
      ctx.font = "24px Arial";
      ctx.fillText("Ukpono Udobong", 60, 200); // text, x, y
    }

    // Loads and draws an image on the canvas
    function drawImage() {
      let img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 100, 220, 150, 150); // image, x, y, width, height
      }
      img.src = "https://th.bing.com/th/id/OIP.pskKrUwDImzjvOfjGjOX0AAAAA?rs=1&pid=ImgDetMain";
    }

    // Clears the entire canvas
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  </script>
</head>

<body onload="setupCanvas()">
  <div id="header" class="w3-container w3-flat-carrot">
    <h1>App6---HTML5-Canvas</h1>
  </div>

  <div id="content" class="w3-container">
    <canvas id="myCanvas" width="360" height="500"></canvas>

    <!-- Button Section -->
    <div class="w3-container w3-margin-top">
      <button class="w3-button w3-flat-peter-river" onclick="drawRectangle()">Draw Rectangle</button>
      <button class="w3-button w3-flat-emerald" onclick="drawName()">Draw My Name</button>
      <button class="w3-button w3-flat-amethyst" onclick="drawImage()">Load Image</button>
      <button class="w3-button w3-flat-alizarin" onclick="clearCanvas()">Clear Canvas</button>
    </div>

    <!-- Informative Text -->
    <p class="w3-margin-top">
      This app allows users to interact with an HTML5 canvas via button controls. Developed in the DIY Diagnostics Stream.
    </p>

    <p>
      THIS CODE SHOULD NOT BE USED TO DIAGNOSE ANY KIND OF MEDICAL CONDITION.
    </p>
  </div>

  <footer class="w3-bottom w3-container w3-flat-carrot">
    <p>DIY!</p>
  </footer>
</body>
</html>
