<head>
  <title>App6---HTML5-Canvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Import W3.CSS and flat color styles -->
  <link rel="stylesheet" href="w3.css">
  <link rel="stylesheet" href="w3-colors-flat.css">
</head>

<script>
  // Display the last modified date of this file when the page loads
  var docMod = document.lastModified;
  alert("This file last modified " + docMod); // Pops up an alert with the last modified date
  console.log("This file last modified " + docMod); // Logs the last modified date to the console
</script>

<style>
  .body {
    margin: 0em; /* Removes default margin around the body */
  }
  .page {
    width: 100vw; /* Sets page width to full viewport width */
    height: 100vh; /* Sets page height to full viewport height */
    position: fixed;
    top: 0;
    left: -100vw;
    overflow-y: auto; /* Enables vertical scrolling */
    z-index: 0;
    background-color: hsl(0,0%,100%); /* White background */
  }
  .page:target {
    left: 0vw;
    z-index: 1; /* Makes the target page visible */
  }
  canvas {
    border: 2px solid #34495e; /* Adds a dark border around canvas */
    background-color: #ecf0f1; /* Light grey canvas background */
  }
</style>

<body>
  <!-- Header bar -->
  <div id="header" class="w3-container w3-flat-carrot">
    <h1>App6---HTML5-Canvas</h1>
  </div>

  <!-- Main content area -->
  <div id="content" class="w3-container">
    <p>Welcome! Use the buttons below to draw, write, or clear the canvas.</p>

    <!-- Canvas element for drawing -->
    <canvas id="myCanvas" width="300" height="300"></canvas><br>

    <!-- Control buttons for canvas actions -->
    <button onclick="drawRectangle()" class="w3-button w3-flat-peter-river">Draw Rectangle</button>
    <button onclick="drawText()" class="w3-button w3-flat-emerald">Draw Name</button>
    <button onclick="drawImage()" class="w3-button w3-flat-sun-flower">Draw Image</button>
    <button onclick="clearCanvas()" class="w3-button w3-flat-alizarin">Clear Canvas</button>

    <script>
      // Get the canvas and its context
      var canvas = document.getElementById("myCanvas");
      var ctx = canvas.getContext("2d");

      // Draws a rectangle on the canvas
      function drawRectangle() {
        ctx.fillStyle = "#3498db"; // Blue color fill
        ctx.fillRect(50, 50, 150, 100); // Draw rectangle (x, y, width, height)
      }

      // Writes text (your name) onto the canvas
      function drawText() {
        ctx.font = "20px Arial";
        ctx.fillStyle = "#2c3e50"; // Dark text color
        ctx.fillText("Ukpono Udobong", 60, 200); // Draw text at x=60, y=200
      }

      // Draws an image onto the canvas
      function drawImage() {
        var img = new Image();
        img.onload = function() {
          ctx.drawImage(img, 10, 10, 100, 100); // Draw image at top-left corner
        };
        img.src = "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1e/UT_wordmark.svg/1280px-UT_wordmark.svg.png"; // Sample image URL
      }

      // Clears the entire canvas
      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear all canvas content
      }
    </script>

    <!-- Footer information -->
    <footer class="w3-bottom w3-container w3-flat-carrot">
      <p>DIY Diagnostics Stream • UT Austin</p>
    </footer>
  </div>
</body>
</html>
