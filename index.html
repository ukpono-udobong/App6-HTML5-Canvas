<head>
  <title>App6---HTML5-Canvas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="w3.css">
  <link rel="stylesheet" href="w3-colors-flat.css">
</head>

<script>
// Log the last modified timestamp for debugging version updates
var docMod = document.lastModified;
alert("This file last modified " + docMod);
console.log("This file last modified " + docMod);
</script>

<style>
.body {
  margin: 0em;
}
.page {
  width: 100vw;
  height: 100vh;
  position: fixed;
  top: 0;
  left: -100vw;
  overflow-y: auto;
  z-index: 0;
  background-color: hsl(0,0%,100%);
}
.page:target {
  left: 0vw;
  z-index: 1;
}
</style>

<body>
  <!-- Header -->
  <div id="header" class="w3-container w3-flat-carrot">
    <h1>App6---HTML5-Canvas</h1>
  </div>

  <!-- Main Content -->
  <div id="content" class="w3-container">
    <p>This application demonstrates basic canvas functionality including drawing shapes, text, images, and clearing the canvas.</p>

    <!-- Canvas element -->
    <canvas id="myCanvas" width="350" height="400" style="border:2px solid #34495e;"></canvas>

    <!-- Buttons for interaction -->
    <br>
    <button onclick="drawRectangle()">Draw Rectangle</button>
    <button onclick="drawName()">Draw Name</button>
    <button onclick="drawImage()">Draw Image</button>
    <button onclick="clearCanvas()">Clear Canvas</button>
  </div>

  <!-- Footer -->
  <footer class="w3-bottom w3-container w3-flat-carrot">
    <p>DIY!</p>
  </footer>

  <!-- JavaScript Functions -->
  <script>
    // Access canvas and its context
    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    // Draw a rectangle on the canvas
    function drawRectangle() {
      ctx.fillStyle = "#3498db"; // Peter River color
      ctx.fillRect(20, 20, 150, 100); // x, y, width, height
    }

    // Draw text (name) on the canvas
    function drawName() {
      ctx.font = "20px Arial";
      ctx.fillStyle = "#2ecc71"; // Emerald color
      ctx.fillText("Ukpono", 50, 200); // x, y position of text
    }

    // Load and draw an image onto the canvas
    function drawImage() {
      const img = new Image();
      img.onload = function () {
        ctx.drawImage(img, 100, 220, 150, 150); // Draw image at x=100, y=220 with width=150, height=150
      };
      img.src = "https://th.bing.com/th/id/OIP.pskKrUwDImzjvOfjGjOX0AAAAA?rs=1&pid=ImgDetMain";
    }

    // Clear the canvas
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height); // Clear entire canvas
    }
  </script>
</body>
</html>
